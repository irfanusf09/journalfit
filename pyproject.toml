[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "journalfit"
version = "0.1.0"
description = "Find the best-fit journal for a manuscript, check its metrics, prepare and assist the submission."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.0",
  "requests>=2.31",
  "python-docx>=1.1",
  "pypdf>=4.0",
  "openpyxl>=3.1",
  "beautifulsoup4>=4.12",
  "numpy>=1.26",
  "rich>=13",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=8"]

[project.scripts]
journalfit = "journalfit.cli:main"

[tool.setuptools.packages.find]
include = ["journalfit*"]
